<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carton</title>

    <link rel="stylesheet" href="../static/styles.css">
</head>

<body>

<div class="coletor">

    <div class="topo">
        <span id="hora"></span>
        <span>🔋78%</span>
    </div>

    <div class="conteudo">

        <div class="linha-info">
            <span>SKU:</span>
            <span id="sku" class="codigo"></span>
            
            <br>
            <span class="espaco"></span>
            <span class="espaco"></span>
            <span class="texto-branco">UOM: IP</span>
        </div>

        <div class="linha-info">
            <span>Qt:</span>

            <span class="espaco"></span>

            <span id="quantidade" class="codigo"></span>


            <input
                type="text"
                id="entrada"
                class="qty-carton-pqn"
                maxlength="3"
                value="1"
                readonly
            >
        </div>

        <br>

        <div class="linha-info">
            <span>Carton Number:</span>
        </div>

        <div class="linha-info">
            <span id="carton-info" class="codigo no-select">
                
            </span>
        </div>

        <br>

        <input
            type="text"
            id="carton"
            inputmode="none"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            class="qty-carton"
            maxlength="20"
            autofocus
        >

    </div>

</div>

<script src="../static/tarefas.js"></script>
<script src="../static/rf.js"></script>
<script src="../static/carton.js"></script>

</body>
</html>
